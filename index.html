<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gastos do Mês</title>
<meta name="theme-color" content="#c8102e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>
  // Aplica o tema salvo antes de desenhar a página (evita "piscar" a cor errada)
  try { const t = localStorage.getItem('gastos-tema'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  :root {
    --bg: #fbf4f4; --card: #ffffff; --text: #2a1b1d; --muted: #846b6e;
    --line: #f0e2e3; --accent: #c8102e; --accent-2: #d00a2a; --accent-soft: #fde0e4;
    --hero-1: #d00a2a; --hero-2: #7a0019;
    --pos: #b00020; --neg: #16a34a; --shadow: 0 2px 10px rgba(60,20,20,.07);
  }
  /* Tema escuro: automático (segue o sistema) ou forçado pelo usuário */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #140e0f; --card: #221819; --text: #f6ecec; --muted: #ab9093;
      --line: #3a2a2c; --accent: #ff4d6a; --accent-2: #d00a2a; --accent-soft: #3d1219;
      --hero-1: #b8001f; --hero-2: #5c0012;
      --pos: #fca5a5; --neg: #4ade80; --shadow: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #140e0f; --card: #221819; --text: #f6ecec; --muted: #ab9093;
    --line: #3a2a2c; --accent: #ff4d6a; --accent-2: #d00a2a; --accent-soft: #3d1219;
    --hero-1: #b8001f; --hero-2: #5c0012;
    --pos: #fca5a5; --neg: #4ade80; --shadow: none;
    color-scheme: dark;
  }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  header.hero {
    background: linear-gradient(135deg, var(--hero-1), var(--hero-2));
    color: #fff; border-radius: 20px; padding: 20px; box-shadow: var(--shadow);
  }
  .month-nav { display: flex; align-items: center; justify-content: space-between; }
  .month-nav button {
    background: rgba(255,255,255,.18); border: 0; color: #fff; width: 36px; height: 36px;
    border-radius: 50%; font-size: 18px; cursor: pointer;
  }
  .month-nav strong { font-size: 16px; }
  .saldo-label { margin-top: 18px; opacity: .85; font-size: 13px; }
  .saldo { font-size: 38px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin-top: 14px; padding-bottom: 2px; }
  .chip {
    flex: 0 0 auto; background: rgba(255,255,255,.16); border-radius: 12px; padding: 8px 12px;
    font-size: 12px; white-space: nowrap;
  }
  .chip b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
  section.box {
    background: var(--card); border-radius: 18px; padding: 16px; margin-top: 16px; box-shadow: var(--shadow);
  }
  section.box h2 { margin: 0 0 12px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
  .seg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 8px;
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
  .chart { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .chart svg { width: 160px; height: 160px; flex: 0 0 auto; }
  .legend { flex: 1 1 200px; min-width: 0; }
  .legend .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .legend .row:last-child { border-bottom: 0; }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
  .legend .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend .val { font-variant-numeric: tabular-nums; font-weight: 600; }
  .legend .pct { color: var(--muted); font-size: 12px; width: 42px; text-align: right; }
  .bar { height: 6px; background: var(--bg); border-radius: 4px; margin-top: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 4px; }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; }
  ul.tx { list-style: none; margin: 0; padding: 0; }
  ul.tx li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  ul.tx li:last-child { border-bottom: 0; }
  .tx .info { flex: 1; min-width: 0; }
  .tx .desc { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx .meta { color: var(--muted); font-size: 12px; }
  .tx .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tx .amt.gasto { color: var(--pos); }
  .tx .amt.pagamento { color: var(--neg); }
  .icon-btn {
    background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px;
    width: 34px; height: 34px; border-radius: 9px; display: inline-grid; place-items: center; flex: 0 0 auto;
  }
  .icon-btn:hover { background: var(--bg); color: var(--text); }
  .icon-btn.danger:hover { background: var(--accent-soft); color: var(--accent); }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tx-actions { display: flex; gap: 2px; margin-right: -6px; }
  .btn.danger { background: var(--accent-soft); color: var(--accent); font-weight: 600; margin-right: auto; }
  .fab {
    position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom));
    width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--accent-2); color: #fff;
    font-size: 30px; box-shadow: 0 6px 20px rgba(208,10,42,.45); cursor: pointer;
  }
  dialog {
    border: 0; border-radius: 20px; padding: 0; width: min(520px, calc(100vw - 32px));
    background: var(--card); color: var(--text);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  form.sheet { padding: 20px; display: grid; gap: 12px; }
  form.sheet h3 { margin: 0; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select {
    font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); width: 100%;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  .btn { font: inherit; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: var(--bg); color: var(--text); }
  .btn.primary { background: var(--accent-2); color: #fff; font-weight: 600; }
  .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .type-toggle input { display: none; }
  .type-toggle span {
    display: block; text-align: center; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    cursor: pointer; color: var(--text); font-size: 14px;
  }
  .type-toggle input:checked + span { border-color: var(--accent); background: var(--bg); font-weight: 600; }
  .manage-list { display: grid; gap: 6px; max-height: 320px; overflow: auto; }
  .manage-list div { display: flex; align-items: center; gap: 8px; }
  .swatch {
    width: 38px; height: 38px; padding: 0; border: 0; border-radius: 10px; background: none; cursor: pointer; flex: 0 0 auto;
  }
  .swatch::-webkit-color-swatch-wrapper { padding: 0; }
  .swatch::-webkit-color-swatch { border: 2px solid var(--line); border-radius: 10px; }
  .swatch::-moz-color-swatch { border: 2px solid var(--line); border-radius: 10px; }
  .manage-list .rename { flex: 1; min-width: 0; padding: 8px 10px; background: transparent; border-color: transparent; }
  .manage-list .rename:hover, .manage-list .rename:focus { border-color: var(--line); background: var(--bg); }
  .manage-hint { margin: -4px 0 0; color: var(--muted); font-size: 12px; }
  .add-inline { display: flex; gap: 8px; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tool {
    display: flex; align-items: center; gap: 10px; text-align: left; min-width: 0;
    background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
    font: inherit; color: var(--text); cursor: pointer; transition: border-color .15s, transform .1s;
  }
  .tool:hover { border-color: var(--accent); }
  .tool:active { transform: scale(.97); }
  .tool-ic {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
  }
  .tool-ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tool-txt { display: grid; min-width: 0; }
  .tool-txt b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .theme-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .theme-label { font-weight: 600; font-size: 14px; }
  .tool-txt small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="month-nav">
      <button id="prevM" aria-label="Mês anterior">‹</button>
      <strong id="monthLabel"></strong>
      <button id="nextM" aria-label="Próximo mês">›</button>
    </div>
    <div class="saldo-label">Total a pagar (todos os cartões/contas)</div>
    <div class="saldo" id="saldo">R$ 0,00</div>
    <div class="chips" id="cardChips"></div>
  </header>

  <section class="box">
    <h2>Onde foi gasto
      <span class="seg" id="chartSeg">
        <button data-by="cat" class="on">Categoria</button>
        <button data-by="card">Cartão</button>
      </span>
    </h2>
    <div class="chart" id="chart"></div>
  </section>

  <section class="box">
    <h2>Lançamentos</h2>
    <ul class="tx" id="txList"></ul>
  </section>

  <section class="box">
    <h2>Configurações</h2>
    <div class="tools">
      <button id="manageCards" class="tool">
        <span class="tool-ic">
          <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19M6 15h4"/></svg>
        </span>
        <span class="tool-txt"><b>Cartões</b><small id="cardsCount"></small></span>
      </button>
      <button id="manageCats" class="tool">
        <span class="tool-ic">
          <svg viewBox="0 0 24 24"><path d="M3 12V4.5A1.5 1.5 0 0 1 4.5 3H12l9 9-9 9-9-9z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
        </span>
        <span class="tool-txt"><b>Categorias</b><small id="catsCount"></small></span>
      </button>
      <button id="exportBtn" class="tool">
        <span class="tool-ic">
          <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
        </span>
        <span class="tool-txt"><b>Exportar</b><small>Extrato em PDF</small></span>
      </button>
      <button id="importBtn" class="tool">
        <span class="tool-ic">
          <svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 20h16"/></svg>
        </span>
        <span class="tool-txt"><b>Importar</b><small>Ler extrato PDF</small></span>
      </button>
    </div>
    <div class="theme-row">
      <span class="theme-label">Tema</span>
      <span class="seg" id="themeSeg">
        <button data-theme="auto">Automático</button>
        <button data-theme="light">☀️ Claro</button>
        <button data-theme="dark">🌙 Escuro</button>
      </span>
    </div>
    <input type="file" id="importFile" accept="application/pdf,.pdf,application/json,.json" hidden>
  </section>
</main>

<button class="fab" id="addBtn" aria-label="Adicionar lançamento">+</button>

<dialog id="txDialog">
  <form class="sheet" method="dialog" id="txForm">
    <h3 id="txTitle">Novo lançamento</h3>
    <div class="type-toggle">
      <label><input type="radio" name="type" value="gasto" checked><span>➕ Gasto</span></label>
      <label><input type="radio" name="type" value="pagamento"><span>➖ Pagamento/Estorno</span></label>
    </div>
    <label>Descrição<input name="desc" required placeholder="Ex.: Camiseta"></label>
    <div class="row2">
      <label>Valor (R$)<input name="amount" required inputmode="decimal" placeholder="100,00"></label>
      <label>Data<input name="date" type="date" required></label>
    </div>
    <div class="row2">
      <label>Cartão/Conta<select name="card" required></select></label>
      <label>Categoria<select name="cat" required></select></label>
    </div>
    <div class="actions">
      <button type="button" class="btn danger" id="txDelete" hidden>Excluir</button>
      <button type="button" class="btn" id="txCancel">Cancelar</button>
      <button type="submit" class="btn primary">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="manageDialog">
  <form class="sheet" method="dialog" id="manageForm">
    <h3 id="manageTitle"></h3>
    <p class="manage-hint">Toque na cor para trocá-la e no nome para renomear.</p>
    <div class="manage-list" id="manageList"></div>
    <div class="add-inline">
      <input id="manageName" placeholder="Nome">
      <input id="manageColor" class="swatch" type="color" value="#d00a2a">
      <button type="button" class="btn primary" id="manageAdd">Adicionar</button>
    </div>
    <div class="actions"><button class="btn">Fechar</button></div>
  </form>
</dialog>

<dialog id="exportDialog">
  <form class="sheet" method="dialog" id="exportForm">
    <h3>Exportar extrato em PDF</h3>
    <p class="manage-hint">O PDF pode ser lido de volta em <b>Importar</b> para restaurar os lançamentos.</p>
    <div class="type-toggle">
      <label><input type="radio" name="period" value="month" checked><span id="exportMonthLabel">Este mês</span></label>
      <label><input type="radio" name="period" value="all"><span>Todos os meses</span></label>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="exportCancel">Cancelar</button>
      <button type="submit" class="btn primary" id="exportGo">Gerar PDF</button>
    </div>
  </form>
</dialog>

<script>
const PALETTE = ['#d00a2a','#f59e0b','#10b981','#3b82f6','#a855f7','#ec4899','#14b8a6','#84cc16','#f97316','#64748b'];
const KEY = 'gastos-mes-v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const $ = s => document.querySelector(s);

const defaults = () => ({
  cards: [
    { id: uid(), name: 'Nubank', color: '#8b5cf6' },
    { id: uid(), name: 'Itaú', color: '#f97316' },
    { id: uid(), name: 'Conta corrente', color: '#06b6d4' },
  ],
  cats: ['Alimentação','Roupas','Transporte','Casa','Lazer','Saúde','Outros']
    .map((n, i) => ({ id: uid(), name: n, color: PALETTE[i] })),
  tx: [],
});

let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || defaults(); } catch { state = defaults(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

const now = new Date();
let view = { y: now.getFullYear(), m: now.getMonth(), by: 'cat' };
let editingId = null;

const monthKey = () => `${view.y}-${String(view.m + 1).padStart(2, '0')}`;
const monthTx = () => state.tx.filter(t => t.date.startsWith(monthKey()));
const signed = t => t.type === 'pagamento' ? -t.amount : t.amount;
const find = (list, id) => list.find(x => x.id === id) || { name: '(removido)', color: '#94a3b8' };

function render() {
  const label = new Date(view.y, view.m, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  $('#monthLabel').textContent = label[0].toUpperCase() + label.slice(1);

  const txs = monthTx();
  const total = txs.reduce((s, t) => s + signed(t), 0);
  $('#saldo').textContent = brl(total);

  // saldo por cartão
  $('#cardChips').innerHTML = state.cards.map(c => {
    const v = txs.filter(t => t.card === c.id).reduce((s, t) => s + signed(t), 0);
    return `<div class="chip">${esc(c.name)}<b>${brl(v)}</b></div>`;
  }).join('');

  const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
  $('#cardsCount').textContent = plural(state.cards.length, 'cadastrado', 'cadastrados');
  $('#catsCount').textContent = plural(state.cats.length, 'cadastrada', 'cadastradas');

  renderChart(txs);
  renderList(txs);
}

function renderChart(txs) {
  const list = view.by === 'cat' ? state.cats : state.cards;
  const field = view.by === 'cat' ? 'cat' : 'card';
  // gráfico considera apenas gastos (o que entrou na fatura)
  const sums = {};
  txs.filter(t => t.type === 'gasto').forEach(t => sums[t[field]] = (sums[t[field]] || 0) + t.amount);
  const rows = Object.entries(sums).map(([id, v]) => ({ ...find(list, id), v })).sort((a, b) => b.v - a.v);
  const tot = rows.reduce((s, r) => s + r.v, 0);

  if (!tot) { $('#chart').innerHTML = '<div class="empty">Nenhum gasto neste mês ainda.</div>'; return; }

  const R = 60, C = 2 * Math.PI * R;
  let off = 0;
  const arcs = rows.map(r => {
    const len = r.v / tot * C;
    const a = `<circle r="${R}" cx="80" cy="80" fill="none" stroke="${r.color}" stroke-width="26"
      stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;
    off += len; return a;
  }).join('');

  $('#chart').innerHTML = `
    <svg viewBox="0 0 160 160">${arcs}
      <text x="80" y="76" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">Gastos</text>
      <text x="80" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">${brl(tot)}</text>
    </svg>
    <div class="legend">${rows.map(r => `
      <div class="row" style="display:block">
        <div style="display:flex;gap:8px;align-items:center">
          <span class="dot" style="background:${r.color}"></span>
          <span class="name">${esc(r.name)}</span>
          <span class="val">${brl(r.v)}</span>
          <span class="pct">${Math.round(r.v / tot * 100)}%</span>
        </div>
        <div class="bar"><i style="width:${r.v / tot * 100}%;background:${r.color}"></i></div>
      </div>`).join('')}
    </div>`;
}

function renderList(txs) {
  const sorted = [...txs].sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
  if (!sorted.length) { $('#txList').innerHTML = '<li class="empty" style="display:block">Toque em + para adicionar.</li>'; return; }
  $('#txList').innerHTML = sorted.map(t => {
    const c = find(state.cards, t.card), k = find(state.cats, t.cat);
    const d = t.date.split('-').reverse().slice(0, 2).join('/');
    return `<li>
      <span class="dot" style="background:${k.color}"></span>
      <div class="info" data-edit="${t.id}" style="cursor:pointer">
        <div class="desc">${esc(t.desc)}</div>
        <div class="meta">${d} · ${esc(c.name)} · ${esc(k.name)}</div>
      </div>
      <span class="amt ${t.type}">${t.type === 'pagamento' ? '−' : '+'} ${brl(t.amount)}</span>
      <span class="tx-actions">
        <button class="icon-btn" data-edit="${t.id}" aria-label="Editar" title="Editar">${ICON_EDIT}</button>
        <button class="icon-btn danger" data-del="${t.id}" aria-label="Excluir" title="Excluir">${ICON_DEL}</button>
      </span>
    </li>`;
  }).join('');
}

const ICON_EDIT = '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>';
const ICON_DEL = '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

function deleteTx(id) {
  const t = state.tx.find(x => x.id === id); if (!t) return false;
  if (!confirm(`Excluir "${t.desc}" (${brl(t.amount)})?`)) return false;
  state.tx = state.tx.filter(x => x.id !== id); save(); render();
  return true;
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

// ---------- lançamento ----------
const txDialog = $('#txDialog'), txForm = $('#txForm');

function openTx(t) {
  editingId = t ? t.id : null;
  $('#txTitle').textContent = t ? 'Editar lançamento' : 'Novo lançamento';
  $('#txDelete').hidden = !t;
  txForm.card.innerHTML = state.cards.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  txForm.cat.innerHTML = state.cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const today = new Date();
  const inView = today.getFullYear() === view.y && today.getMonth() === view.m;
  const defDate = inView ? `${monthKey()}-${String(today.getDate()).padStart(2, '0')}` : `${monthKey()}-01`;
  txForm.desc.value = t ? t.desc : '';
  txForm.amount.value = t ? String(t.amount).replace('.', ',') : '';
  txForm.date.value = t ? t.date : defDate;
  txForm.type.value = t ? t.type : 'gasto';
  if (t) { txForm.card.value = t.card; txForm.cat.value = t.cat; }
  else if (state.lastCard) txForm.card.value = state.lastCard;
  txDialog.showModal();
  if (!t) txForm.desc.focus();
}

txForm.addEventListener('submit', e => {
  const raw = txForm.amount.value.trim().replace(/\./g, '').replace(',', '.');
  const amount = Math.round(parseFloat(raw) * 100) / 100;
  if (!(amount > 0)) { e.preventDefault(); txForm.amount.setCustomValidity('Valor inválido'); txForm.amount.reportValidity(); return; }
  const data = {
    desc: txForm.desc.value.trim(), amount, date: txForm.date.value,
    type: txForm.type.value, card: txForm.card.value, cat: txForm.cat.value,
  };
  if (editingId) Object.assign(state.tx.find(t => t.id === editingId), data);
  else state.tx.push({ id: uid(), created: Date.now(), ...data });
  state.lastCard = data.card;
  const [y, m] = data.date.split('-').map(Number);
  view.y = y; view.m = m - 1;
  save(); render();
});
txForm.amount.addEventListener('input', () => txForm.amount.setCustomValidity(''));
$('#txCancel').onclick = () => txDialog.close();
$('#txDelete').onclick = () => { if (deleteTx(editingId)) txDialog.close(); };
$('#addBtn').onclick = () => openTx();

$('#txList').addEventListener('click', e => {
  const del = e.target.closest('[data-del]'), ed = e.target.closest('[data-edit]');
  if (del) deleteTx(del.dataset.del);
  else if (ed) openTx(state.tx.find(t => t.id === ed.dataset.edit));
});

// ---------- navegação ----------
$('#prevM').onclick = () => { view.m--; if (view.m < 0) { view.m = 11; view.y--; } render(); };
$('#nextM').onclick = () => { view.m++; if (view.m > 11) { view.m = 0; view.y++; } render(); };
$('#chartSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  view.by = b.dataset.by;
  document.querySelectorAll('#chartSeg button').forEach(x => x.classList.toggle('on', x === b));
  render();
});

// ---------- gerenciar cartões / categorias ----------
let manageKey = 'cards';
function openManage(key) {
  manageKey = key;
  $('#manageTitle').textContent = key === 'cards' ? 'Cartões e contas' : 'Categorias';
  $('#manageColor').value = PALETTE[state[key].length % PALETTE.length];
  renderManage(); $('#manageDialog').showModal();
}
function renderManage() {
  $('#manageList').innerHTML = state[manageKey].map(x => `
    <div data-id="${x.id}">
      <input type="color" class="swatch" value="${x.color}" aria-label="Cor de ${esc(x.name)}" title="Mudar cor">
      <input class="rename" value="${esc(x.name)}" aria-label="Nome" title="Toque para renomear">
      <button type="button" class="icon-btn danger" data-rm="${x.id}" aria-label="Remover" title="Remover">${ICON_DEL}</button>
    </div>`).join('');
}
const manageItem = el => state[manageKey].find(x => x.id === el.closest('[data-id]')?.dataset.id);
// Cor: atualiza ao vivo enquanto escolhe
$('#manageList').addEventListener('input', e => {
  if (!e.target.matches('.swatch')) return;
  const it = manageItem(e.target); if (!it) return;
  it.color = e.target.value; save(); render();
});
// Nome: salva ao sair do campo
$('#manageList').addEventListener('change', e => {
  if (!e.target.matches('.rename')) return;
  const it = manageItem(e.target); if (!it) return;
  const name = e.target.value.trim();
  if (!name) { e.target.value = it.name; return; }
  it.name = name; save(); render();
});
$('#manageList').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.rename')) { e.preventDefault(); e.target.blur(); }
});
$('#manageList').addEventListener('click', e => {
  const b = e.target.closest('[data-rm]'); if (!b) return;
  if (state[manageKey].length <= 1) return alert('Mantenha pelo menos um item.');
  const field = manageKey === 'cards' ? 'card' : 'cat';
  const used = state.tx.some(t => t[field] === b.dataset.rm);
  if (used && !confirm('Há lançamentos usando este item. Remover mesmo assim?')) return;
  state[manageKey] = state[manageKey].filter(x => x.id !== b.dataset.rm);
  save(); renderManage(); render();
});
$('#manageAdd').onclick = () => {
  const name = $('#manageName').value.trim(); if (!name) return;
  state[manageKey].push({ id: uid(), name, color: $('#manageColor').value });
  $('#manageName').value = '';
  $('#manageColor').value = PALETTE[state[manageKey].length % PALETTE.length];
  save(); renderManage(); render();
};
$('#manageName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#manageAdd').click(); } });
$('#manageCards').onclick = () => openManage('cards');
$('#manageCats').onclick = () => openManage('cats');

// ---------- tema ----------
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.theme === t));
}
let theme = 'auto';
try { theme = localStorage.getItem('gastos-tema') || 'auto'; } catch {}
applyTheme(theme);
$('#themeSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  theme = b.dataset.theme;
  try { theme === 'auto' ? localStorage.removeItem('gastos-tema') : localStorage.setItem('gastos-tema', theme); } catch {}
  applyTheme(theme);
});

// ---------- extrato em PDF (exportar / importar) ----------
// O PDF mostra o extrato legível e também leva os lançamentos embutidos
// (nos metadados, campo Keywords, como "GASTOS1:<base64 do JSON>"),
// para que o próprio app consiga ler o arquivo de volta no Importar.
const PDF_LIBS = [
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js',
];
const PDF_MARK = 'GASTOS1:';
let pdfLibsPromise = null;
function loadPdfLibs() {
  const load = src => new Promise((ok, fail) => {
    const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s);
  });
  return pdfLibsPromise ||= load(PDF_LIBS[0]).then(() => load(PDF_LIBS[1])).catch(e => { pdfLibsPromise = null; throw e; });
}

const b64encode = str => { let bin = ''; new TextEncoder().encode(str).forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };
const b64decode = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
const monthTitle = key => {
  const [y, m] = key.split('-').map(Number);
  const s = new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  return s[0].toUpperCase() + s.slice(1);
};

function buildStatement(keys) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 14;
  const RED = [200, 16, 46], WINE = [122, 0, 25], TEXT = [42, 27, 29], MUTED = [132, 107, 110], SOFT = [253, 224, 228], GREEN = [22, 130, 60];
  // fontes padrão do PDF não têm espaço fino nem sinal de menos tipográfico
  const clean = s => String(s).replace(/[  ]/g, ' ').replace(/−/g, '-');
  const money = v => clean(brl(v));
  const minus = v => v ? `- ${money(v)}` : money(0);
  // `right`: colunas de valores, alinhadas à direita também no cabeçalho e no total
  const table = ({ right = [], ...opts }) => doc.autoTable({
    theme: 'grid', margin: { left: M, right: M },
    styles: { fontSize: 9, cellPadding: 2.2, textColor: TEXT, lineColor: [240, 226, 227], lineWidth: .2 },
    headStyles: { fillColor: WINE, textColor: 255, fontStyle: 'bold' },
    footStyles: { fillColor: SOFT, textColor: TEXT, fontStyle: 'bold' },
    ...opts,
    didParseCell: d => {
      if (right.includes(d.column.index)) d.cell.styles.halign = 'right';
      if (d.section === 'body' && String(d.cell.raw).startsWith('- ')) d.cell.styles.textColor = GREEN;
    },
  });
  const title = (txt, y) => {
    if (y > H - 40) { doc.addPage(); y = 20; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...TEXT); doc.text(txt, M, y);
    return y + 3;
  };
  const generated = new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });

  keys.forEach((key, i) => {
    if (i) doc.addPage();
    const txs = state.tx.filter(t => t.date.startsWith(key))
      .sort((a, b) => a.date.localeCompare(b.date) || (a.created || 0) - (b.created || 0));
    const total = txs.reduce((s, t) => s + signed(t), 0);

    // cabeçalho
    doc.setFillColor(...RED); doc.rect(0, 0, W, 36, 'F');
    doc.setFillColor(...WINE); doc.rect(0, 36, W, 2, 'F');
    doc.setTextColor(255);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.text('Extrato de Gastos', M, 15);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.text(monthTitle(key), M, 23);
    doc.setFontSize(8); doc.text(`Gerado em ${generated}`, M, 30);
    doc.setFontSize(9); doc.text('Total a pagar', W - M, 14, { align: 'right' });
    doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.text(money(total), W - M, 25, { align: 'right' });

    // resumo por cartão / conta
    let y = title('Resumo por cartão / conta', 48);
    const cardRows = state.cards.map(c => {
      const ts = txs.filter(t => t.card === c.id);
      const g = ts.filter(t => t.type === 'gasto').reduce((s, t) => s + t.amount, 0);
      const p = ts.filter(t => t.type === 'pagamento').reduce((s, t) => s + t.amount, 0);
      return { name: c.name, g, p, n: ts.length };
    }).filter(r => r.n);
    const sumG = cardRows.reduce((s, r) => s + r.g, 0), sumP = cardRows.reduce((s, r) => s + r.p, 0);
    table({
      startY: y,
      head: [['Cartão / conta', 'Gastos', 'Pagamentos / estornos', 'Saldo']],
      body: cardRows.length ? cardRows.map(r => [r.name, money(r.g), minus(r.p), money(r.g - r.p)]) : [['Sem lançamentos neste mês', '', '', '']],
      foot: [['Total', money(sumG), minus(sumP), money(total)]],
      right: [1, 2, 3],
    });

    // gastos por categoria
    y = title('Gastos por categoria', doc.lastAutoTable.finalY + 10);
    const catRows = state.cats.map(c => ({
      name: c.name, v: txs.filter(t => t.type === 'gasto' && t.cat === c.id).reduce((s, t) => s + t.amount, 0),
    })).filter(r => r.v).sort((a, b) => b.v - a.v);
    table({
      startY: y,
      head: [['Categoria', 'Valor', '%']],
      body: catRows.length ? catRows.map(r => [r.name, money(r.v), `${Math.round(r.v / sumG * 100)}%`]) : [['Sem gastos neste mês', '', '']],
      foot: [['Total de gastos', money(sumG), sumG ? '100%' : '']],
      columnStyles: { 2: { cellWidth: 18 } }, right: [1, 2],
    });

    // lançamentos
    y = title('Lançamentos', doc.lastAutoTable.finalY + 10);
    table({
      startY: y,
      head: [['Data', 'Descrição', 'Cartão / conta', 'Categoria', 'Valor']],
      body: txs.length ? txs.map(t => [
        t.date.split('-').reverse().join('/'), t.desc, find(state.cards, t.card).name, find(state.cats, t.cat).name,
        t.type === 'pagamento' ? minus(t.amount) : money(t.amount),
      ]) : [['', 'Nenhum lançamento', '', '', '']],
      foot: [['', '', '', 'Total a pagar', money(total)]],
      columnStyles: { 0: { cellWidth: 22 }, 4: { cellWidth: 30 } }, right: [4],
    });
  });

  // rodapé com paginação
  const pages = doc.getNumberOfPages();
  for (let p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...MUTED);
    doc.text('Gastos do Mês · mmagc.github.io/gastos-do-mes', M, H - 8);
    doc.text(`Página ${p} de ${pages}`, W - M, H - 8, { align: 'right' });
  }

  const payload = {
    v: 1, app: 'gastos-do-mes', cards: state.cards, cats: state.cats,
    tx: state.tx.filter(t => keys.some(k => t.date.startsWith(k))),
  };
  doc.setProperties({
    title: keys.length === 1 ? `Extrato de Gastos - ${monthTitle(keys[0])}` : 'Extrato de Gastos - todos os meses',
    subject: 'Extrato gerado pelo app Gastos do Mês', creator: 'Gastos do Mês',
    keywords: PDF_MARK + b64encode(JSON.stringify(payload)),
  });
  return doc;
}

async function deliverPdf(doc, filename) {
  const file = new File([doc.output('blob')], filename, { type: 'application/pdf' });
  const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (mobile && navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const exportDialog = $('#exportDialog'), exportForm = $('#exportForm');
$('#exportBtn').onclick = () => {
  $('#exportMonthLabel').textContent = monthTitle(monthKey());
  exportDialog.showModal();
  loadPdfLibs().catch(() => {}); // já vai baixando a biblioteca enquanto o usuário escolhe
};
$('#exportCancel').onclick = () => exportDialog.close();
exportForm.addEventListener('submit', async e => {
  e.preventDefault();
  const all = exportForm.period.value === 'all';
  const keys = all ? [...new Set(state.tx.map(t => t.date.slice(0, 7)))].sort() : [monthKey()];
  if (!state.tx.some(t => keys.some(k => t.date.startsWith(k)))) {
    return alert(all ? 'Ainda não há lançamentos para exportar.' : 'Não há lançamentos neste mês.');
  }
  const go = $('#exportGo'); go.disabled = true; go.textContent = 'Gerando…';
  try {
    await loadPdfLibs();
    const doc = buildStatement(keys);
    const today = new Date();
    const stamp = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    exportDialog.close();
    await deliverPdf(doc, all ? `extrato-gastos-completo-${stamp}.pdf` : `extrato-gastos-${keys[0]}.pdf`);
  } catch (err) {
    console.error(err);
    alert('Não foi possível gerar o PDF. Na primeira vez é preciso estar conectado à internet.');
  } finally { go.disabled = false; go.textContent = 'Gerar PDF'; }
});

// Lê um extrato PDF gerado pelo app (ou um backup .json antigo)
async function readImportFile(f) {
  const buf = await f.arrayBuffer();
  const head = new TextDecoder('latin1').decode(buf.slice(0, 5));
  if (head === '%PDF-') {
    const text = new TextDecoder('latin1').decode(buf);
    const m = text.match(/GASTOS1:([A-Za-z0-9+/=]+)/);
    if (!m) throw new Error('pdf-sem-dados');
    return JSON.parse(b64decode(m[1]));
  }
  return JSON.parse(new TextDecoder().decode(buf));
}

// Junta os dados importados com os atuais: lançamentos com o mesmo id são atualizados,
// os outros são adicionados. Nada que já existe é apagado.
function mergeImport(d) {
  for (const key of ['cards', 'cats']) {
    for (const item of d[key]) if (!state[key].some(x => x.id === item.id)) state[key].push(item);
  }
  for (const t of d.tx) {
    const i = state.tx.findIndex(x => x.id === t.id);
    if (i >= 0) state.tx[i] = t; else state.tx.push(t);
  }
}

$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let d;
  try {
    d = await readImportFile(f);
    if (!Array.isArray(d.tx) || !Array.isArray(d.cards) || !Array.isArray(d.cats)) throw 0;
  } catch (err) {
    return alert(err?.message === 'pdf-sem-dados'
      ? 'Este PDF não foi gerado pelo app Gastos do Mês, então não dá para ler os lançamentos dele.'
      : 'Arquivo inválido. Escolha um extrato PDF exportado por este app.');
  }
  if (!d.tx.length) return alert('O arquivo não tem lançamentos.');
  const existing = d.tx.filter(t => state.tx.some(x => x.id === t.id)).length;
  const fresh = d.tx.length - existing;
  const months = [...new Set(d.tx.map(t => t.date.slice(0, 7)))].sort().map(monthTitle);
  const msg = `Importar ${d.tx.length} lançamento(s) de ${months.join(', ')}?\n\n` +
    `• ${fresh} novo(s)\n• ${existing} já existente(s) (serão atualizados)\n\nNenhum lançamento atual será apagado.`;
  if (!confirm(msg)) return;
  mergeImport(d);
  const [y, m] = d.tx.map(t => t.date).sort().pop().split('-').map(Number);
  view.y = y; view.m = m - 1;
  save(); render();
};

render();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
